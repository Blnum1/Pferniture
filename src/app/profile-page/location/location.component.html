<app-nav-header></app-nav-header>

<div class="container-xxl page with-tabs-offset">
  <div class="row g-3">

    <div class="col-12 col-lg-3">
      <nav class="side-nav">
        <div class="profile-header">
        <div class="avatar"></div>
        <div class="info">
          <div class="name-row">
            <div class="field">
              <div class="label"></div>
              <div class="value">จิรยุทธ์ พรมจีน</div>
            </div>
          </div>
          <div class="phone-row">
            <div class="label th">เบอร์โทร</div>
            <div class="value">088-8888888</div>
          </div>
        </div>
      </div>
        <a class="side-link" [routerLink]="['/pf-1']" routerLinkActive="active"
          [routerLinkActiveOptions]="{exact:true}">
          การสั่งซื้อของฉัน
        </a>
        <a class="side-link" [routerLink]="['/profile']" routerLinkActive="active">บัญชีของฉัน</a>
        <a class="side-link" [routerLink]="['/location']" routerLinkActive="active">ที่อยู่</a>
      </nav>
    </div>

    <!-- Main content (Right) -->
    <div class="col-12 col-lg-9">

      <!-- <<< ทั้งบล็อก location ต้องอยู่ “ข้างใน” col-9 นี้ >>> -->
      <div class="page">
        <div class="page-header">
          <h2 class="title">ที่อยู่ของฉัน</h2>
          <button class="btn-add" (click)="openAddAddress()">เพิ่มที่อยู่ใหม่</button>
        </div>

        <div *ngIf="loading" class="muted">กำลังโหลด…</div>
        <div *ngIf="loadError" class="alert alert-danger">{{ loadError }}</div>

        <div class="list">
          <div class="list-row" *ngFor="let s of shippingList">
            <div class="left">
              <div class="name-phone">
                <span class="name">นายจอห์น โด</span>
                <span class="phone" *ngIf="s.phone">{{ s.phone }}</span>
              </div>
              <div class="addr">
                {{ s.address }}
                <ng-container *ngIf="s.city || s.region || s.postal">
                  , อ.{{ s.city }} , จ.{{ s.region }} <span *ngIf="s.postal">, {{ s.postal }}</span>
                </ng-container>
              </div>
            </div>
            <div class="right">
              <button class="link edit" (click)="openEditAddress(s)">แก้ไข</button>
              <button class="link delete" (click)="confirmDeleteAddress(s)">ลบ</button>
            </div>
          </div>

          <div class="list-row empty" *ngIf="!loading && shippingList.length === 0">
            ยังไม่มีที่อยู่
          </div>
        </div>
      </div>
      <!-- /page -->

    </div> <!-- /col-9 -->
  </div> <!-- /row -->
</div>  <!-- /container -->

<!-- ===== ADD MODAL ===== -->
<div class="modal-custom" *ngIf="showAddModal" (keydown.escape)="closeAddAddress()">
  <div class="modal-card modal-lg">
    <div class="modal-header">
      <div class="fw-semibold">เพิ่มที่อยู่ใหม่</div>
      <button class="btn-close" (click)="closeAddAddress()"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <input class="form-control" placeholder="บ้านเลขที่ / ถนน / อาคาร *" [(ngModel)]="newAddr.house" name="house">
      </div>
      <div class="row g-2">
        <div class="col-md-6"><input class="form-control" placeholder="ตำบล" [(ngModel)]="newAddr.subdistrict"></div>
        <div class="col-md-6"><input class="form-control" placeholder="อำเภอ *" [(ngModel)]="newAddr.district"></div>
        <div class="col-md-6"><input class="form-control" placeholder="จังหวัด *" [(ngModel)]="newAddr.province"></div>
        <div class="col-md-6"><input class="form-control" placeholder="รหัสไปรษณีย์" [(ngModel)]="newAddr.postal" inputmode="numeric"></div>
      </div>
      <div class="mt-3">
        <img src="assets/image/google-map.png" alt="map"
             style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;">
      </div>
      <div class="mt-3">
        <input class="form-control" placeholder="บันทึก/ปักหมุด (ไม่บังคับ)" [(ngModel)]="newAddr.note">
      </div>
      <div *ngIf="addError" class="alert alert-danger mt-3">{{ addError }}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" (click)="closeAddAddress()" [disabled]="addSubmitting">ยกเลิก</button>
      <button class="btn btn-primary" (click)="saveNewAddress()" [disabled]="addSubmitting">
        {{ addSubmitting ? 'กำลังบันทึก…' : 'บันทึก' }}
      </button>
    </div>
  </div>
</div>

<!-- ========== EDIT MODAL ========== -->
<div class="modal-custom" *ngIf="showEditModal" (keydown.escape)="closeEditAddress()">
  <div class="modal-card modal-lg">
    <div class="modal-header">
      <div class="fw-semibold">แก้ไขที่อยู่</div>
      <button class="btn-close" (click)="closeEditAddress()"></button>
    </div>

    <div class="modal-body" *ngIf="editing">
      <div class="mb-3">
        <input class="form-control" placeholder="บ้านเลขที่ / ถนน / อาคาร *" [(ngModel)]="editing.house">
      </div>

      <div class="row g-2">
        <div class="col-md-6"><input class="form-control" placeholder="ตำบล" [(ngModel)]="editing.subdistrict"></div>
        <div class="col-md-6"><input class="form-control" placeholder="อำเภอ *" [(ngModel)]="editing.district"></div>
        <div class="col-md-6"><input class="form-control" placeholder="จังหวัด *" [(ngModel)]="editing.province"></div>
        <div class="col-md-6"><input class="form-control" placeholder="รหัสไปรษณีย์" [(ngModel)]="editing.postal" inputmode="numeric"></div>
      </div>

      <div class="mt-3">
        <img src="assets/image/google-map.png" alt="map"
             style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;">
      </div>

      <div class="mt-3">
        <input class="form-control" placeholder="เบอร์โทร (ไม่บังคับ)" [(ngModel)]="editing.phone">
      </div>

      <div *ngIf="editError" class="alert alert-danger mt-3">{{ editError }}</div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline-secondary" (click)="closeEditAddress()" [disabled]="editSubmitting">ยกเลิก</button>
      <button class="btn btn-primary" (click)="saveEditAddress()" [disabled]="editSubmitting">
        {{ editSubmitting ? 'กำลังบันทึก…' : 'บันทึก' }}
      </button>
    </div>
  </div>
</div>
