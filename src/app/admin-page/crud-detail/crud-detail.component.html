<app-nav-admin></app-nav-admin>
<br />
<br />
<div class="main-container mb-3">

  <!-- แสดงเมื่อโหลดข้อมูลเสร็จแล้ว -->
  <div *ngIf="product" class="row">

    <div class="col-12 mb-4">
      <div class="d-flex justify-content-between align-items-center header-section">
        <h1 class="mb-0 text-primary">📝 {{ isEditMode ? 'กำลังแก้ไข' : 'รายละเอียด' }}สินค้า {{ product.product_Name
          }}</h1>
        <div class="btn-group">

          <!-- ปุ่มบันทึก/แก้ไข -->
          <button type="button" (click)="toggleEditMode()" class="btn btn-lg"
            [ngClass]="isEditMode ? 'btn-success' : 'btn-primary'">
            <i class="fas" [ngClass]="isEditMode ? 'fa-save' : 'fa-edit'"></i>
            {{ isEditMode ? 'บันทึกการเปลี่ยนแปลง' : 'แก้ไข' }}
          </button>
           <button *ngIf="isEditMode" 
                            type="button" 
                            (click)="cancelEdit()" 
                            class="btn btn-lg btn-outline-secondary ms-2">
                        <i class="fas fa-undo"></i> ยกเลิก
                    </button> 
  
          <button type="button" (click)="handleDelete()" class="btn btn-lg btn-danger ms-2" [disabled]="isEditMode">
            <i class="fas fa-trash-alt"></i> ลบ
          </button>
        </div>
      </div>
      <hr>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card h-100 shadow-sm image-management-card">
        <div class="card-body">
          <h4 class="card-title mb-4">🖼️ จัดการรูปภาพสินค้า (แก้ไข URL)</h4>
          <small class="text-muted d-block mb-3">คุณสามารถวาง URL รูปภาพใหม่เพื่อแก้ไขรูปภาพเดิมได้</small>

          <div class="row mb-4 align-items-center">
            <div class="col-md-4">
              <label class="form-label fw-bold">รูปภาพที่ 1</label>
            </div>
            <div class="col-md-8">
              <div *ngIf="product.image_Url1" class="mb-2 image-preview-box" (click)="openModal(product.image_Url1)">
                <img [src]="product.image_Url1" alt="Image 1 Preview" class="img-thumbnail img-fluid preview-image" />
              </div>
              <input [(ngModel)]="product.image_Url1" name="image_Url1" class="form-control form-control-sm"
                placeholder="Paste Image URL 1 here" [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
              <button *ngIf="product.image_Url1 && isEditMode" (click)="removeImage('image_Url1')" type="button"
                class="btn btn-sm btn-outline-danger mt-1 w-100">ลบรูปภาพ 1</button>
            </div>
          </div>

          <div class="row mb-4 align-items-center">
            <div class="col-md-4">
              <label class="form-label fw-bold">รูปภาพที่ 2</label>
            </div>
            <div class="col-md-8">
              <div *ngIf="product.image_Url2" class="mb-2 image-preview-box" (click)="openModal(product.image_Url2)">
                <img [src]="product.image_Url2" alt="Image 2 Preview" class="img-thumbnail img-fluid preview-image" />
              </div>
              <input [(ngModel)]="product.image_Url2" name="image_Url2" class="form-control form-control-sm"
                placeholder="Paste Image URL 2 here" [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
              <button *ngIf="product.image_Url2 && isEditMode" (click)="removeImage('image_Url2')" type="button"
                class="btn btn-sm btn-outline-danger mt-1 w-100">ลบรูปภาพ 2</button>
            </div>
          </div>

          <div class="row mb-4 align-items-center">
            <div class="col-md-4">
              <label class="form-label fw-bold">รูปภาพที่ 3</label>
            </div>
            <div class="col-md-8">
              <div *ngIf="product.image_Url3" class="mb-2 image-preview-box" (click)="openModal(product.image_Url3)">
                <img [src]="product.image_Url3" alt="Image 3 Preview" class="img-thumbnail img-fluid preview-image" />
              </div>
              <input [(ngModel)]="product.image_Url3" name="image_Url3" class="form-control form-control-sm"
                placeholder="Paste Image URL 3 here" [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
              <button *ngIf="product.image_Url3 && isEditMode" (click)="removeImage('image_Url3')" type="button"
                class="btn btn-sm btn-outline-danger mt-1 w-100">ลบรูปภาพ 3</button>
            </div>
          </div>

          <hr class="my-4">
          <div class="upload-new-img p-3 border rounded bg-light" *ngIf="isEditMode">
            <label class="form-label fw-bold">อัปโหลดไฟล์รูปภาพ (แทนการใช้ URL):</label>
            <!-- ⭐⭐⭐ อัปเดต: การอัปโหลดไฟล์จะใช้ URL จาก File Reader มาใส่ใน product.image_Url1/2/3 โดยอัตโนมัติหากช่องว่าง ⭐⭐⭐ -->
            <input type="file" (change)="onImageUpload($event)" class="form-control" accept="image/*" />
            <small class="text-muted mt-1 d-block">ไฟล์ที่อัปโหลดจะถูกแปลงเป็น URL และใส่ในช่องรูปภาพแรกที่ว่าง</small>
          </div>

        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card h-100 shadow-sm product-details-card">
        <div class="card-body">
          <h4 class="card-title mb-4">📦 ข้อมูลพื้นฐานสินค้า</h4>

          <form #productForm="ngForm">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">ชื่อสินค้า</label>
                  <input [(ngModel)]="product.product_Name" name="product_Name" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">รหัสสินค้า</label>
                  <input [(ngModel)]="product.productID" name="productID" readonly class="form-control bg-light" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">ชื่อหมวดหมู่</label>
                  <input [(ngModel)]="product.category_Name" name="category_Name" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">รหัสหมวดหมู่</label>
                  <input [(ngModel)]="product.categoryID" name="categoryID" type="number" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">จำนวนสินค้าคงเหลือ</label>
                  <input [(ngModel)]="product.stock" name="stock" type="number" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">สถานะพร้อมขาย</label>
                  <!-- ⭐ แก้ไข: ใช้ string 'YES'/'NO' เพื่อให้ตรงกับ API/Backend และ Product Interface -->
                  <select [(ngModel)]="product.is_Active" name="is_Active" class="form-select" [disabled]="!isEditMode"
                    [ngClass]="{'bg-light': !isEditMode}">
                    <option [ngValue]="true">Active</option>
                    <option [ngValue]="false">Inactive</option>
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">ขนาด</label>
                  <input [(ngModel)]="product.size" name="size" class="form-control" [readonly]="!isEditMode"
                    [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">สี</label>
                  <input [(ngModel)]="product.color" name="color" class="form-control" [readonly]="!isEditMode"
                    [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">ราคาขายจริง</label>
                  <input [(ngModel)]="product.price" name="price" type="number" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">ราคาก่อนลด</label>
                  <input [(ngModel)]="product.price_Discount" name="price_Discount" type="number" class="form-control"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}" />
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-12 mb-4">
      <div class="card shadow-sm description-card">
        <div class="card-body">
          <h4 class="card-title mb-3">📜 คำอธิบายสินค้า</h4>
          <form #descriptionForm="ngForm">
            <div class="row">
              <div class="col-md-4">
                <div class="form-group mb-3">
                  <label class="form-label">คำอธิบายสินค้า 1</label>
                  <textarea [(ngModel)]="product.pDescription1" name="description1" class="form-control" rows="3"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}"></textarea>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group mb-3">
                  <label class="form-label">คำอธิบายสินค้า 2</label>
                  <textarea [(ngModel)]="product.pDescription2" name="description2" class="form-control" rows="3"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}"></textarea>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group mb-3">
                  <label class="form-label">คำอธิบายสินค้า 3</label>
                  <textarea [(ngModel)]="product.pDescription3" name="description3" class="form-control" rows="3"
                    [readonly]="!isEditMode" [ngClass]="{'bg-light': !isEditMode}"></textarea>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>


</div>

<!-- Modal สำหรับแสดงรูปภาพขนาดเต็ม -->
<div class="modal fade" [ngClass]="{'show': showModal}" [style.display]="showModal ? 'block' : 'none'" tabindex="-1"
  aria-modal="true" role="dialog" (click)="closeModal()">
  <div class="modal-dialog modal-lg modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Image Preview</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body text-center">
        <img [src]="selectedImage" class="img-fluid rounded" alt="Image Preview" />
      </div>
    </div>
  </div>
</div>
