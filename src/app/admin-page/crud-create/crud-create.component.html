<br />
<div class="main-container mb-3">
    <div *ngIf="product" class="row">

        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm image-upload-card">
                <div class="card-body">
                    <h4 class="card-title mb-4">🖼️ รูปภาพสินค้า</h4>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">รูปภาพที่ 1</label>
                        </div>
                        <div class="col-md-8">
                            <div *ngIf="product.image_Url1" class="mb-2">
                                <img [src]="product.image_Url1" alt="Image Preview" width="100%" height="auto" class="img-thumbnail img-fluid preview-image" />
                            </div>
                            <input [(ngModel)]="product.image_Url1" name="image_Url1" class="form-control form-control-sm" placeholder="Paste Image URL here" />
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">รูปภาพที่ 2</label>
                        </div>
                        <div class="col-md-8">
                            <div *ngIf="product.image_Url2" class="mb-2">
                                <img [src]="product.image_Url2" alt="Image Preview" width="100%" height="auto" class="img-thumbnail img-fluid preview-image" />
                            </div>
                            <input [(ngModel)]="product.image_Url2" name="image_Url2" class="form-control form-control-sm" placeholder="Paste Image URL here" />
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">รูปภาพที่ 3</label>
                        </div>
                        <div class="col-md-8">
                            <div *ngIf="product.image_Url3" class="mb-2">
                                <img [src]="product.image_Url3" alt="Image Preview" width="100%" height="auto" class="img-thumbnail img-fluid preview-image" />
                            </div>
                            <input [(ngModel)]="product.image_Url3" name="image_Url3" class="form-control form-control-sm" placeholder="Paste Image URL here" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm product-details-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="mb-0 text-primary">🛍️ เพิ่มสินค้า</h2>
                        <button type="button" (click)="createProduct(product)" class="btn btn-lg btn-success">
                            ยืนยันการเพิ่มสินค้า
                        </button>
                    </div>

                    <h3 class="mb-3">{{ product.product_Name || 'ชื่อสินค้า' }}</h3>

                    <form #productForm="ngForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ชื่อสินค้า</label>
                                    <input [(ngModel)]="product.product_Name" name="product_Name" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">รหัสสินค้า</label>
                                    <input [(ngModel)]="product.productID" name="productID" readonly class="form-control bg-light" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ชื่อหมวดหมู่</label>
                                    <input [(ngModel)]="product.category_Name" name="category_Name" readonly class="form-control bg-light" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">รหัสหมวดหมู่</label>
                                    <input [(ngModel)]="product.categoryID" name="categoryID" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ขนาด</label>
                                    <input [(ngModel)]="product.size" name="size" class="form-control" />
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">สี</label>
                                    <input [(ngModel)]="product.color" name="color" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ราคาขายจริง</label>
                                    <input [(ngModel)]="product.price" name="price" type="number" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ราคาก่อนลด</label>
                                    <input [(ngModel)]="product.price_Discount" name="price_Discount" type="number" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">จำนวนสินค้าคงเหลือ</label>
                                    <input [(ngModel)]="product.stock" name="stock" type="number" class="form-control" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">สถานะพร้อมขาย</label>
                                    <select [(ngModel)]="product.is_Active" name="is_Active" class="form-select">
                                        <option [ngValue]="true">Active</option>
                                        <option [ngValue]="false">Inactive</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h5 class="mb-3">📝 คำอธิบายสินค้า</h5>
                        <div class="mb-3">
                            <label class="form-label">คำอธิบายสินค้า 1</label>
                            <textarea [(ngModel)]="product.pDescription1" name="description1" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">คำอธิบายสินค้า 1</label>
                            <textarea [(ngModel)]="product.pDescription2" name="description2" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">คำอธิบายสินค้า 3</label>
                            <textarea [(ngModel)]="product.pDescription3" name="description3" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
