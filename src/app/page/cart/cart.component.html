<app-nav-header></app-nav-header>
<app-nav-appheader></app-nav-appheader>

<div class="container my-4">
  <h2>ตะกร้าสินค้า</h2>
  
  <div *ngIf="cartItems && cartItems.length > 0; else noItems">
    <div class="row">
      <div *ngFor="let item of cartItems" class="col-12 col-md-4 mb-3">
        <div class="card shadow-sm">
          <!-- <img [src]="item.image_Url1" class="card-img-top" alt="Product Image"> -->
          <div class="card-body">
            <h5 class="card-title">{{ item.product_Name }}</h5>
            <p class="card-text">ราคาต่อชิ้น: {{ item.price_amount | number: '1.0-0' }} ฿</p>
            <p class="card-text">จำนวน: {{ item.quantity }}</p>
            <div class="d-flex justify-content-between">
              <button class="btn btn-outline-secondary" (click)="decreaseQuantity(item.productID)">-</button>
              <button class="btn btn-outline-secondary" (click)="increaseQuantity(item.productID)">+</button>
              <button class="btn btn-danger" (click)="removeFromCart(item.productID)">ลบ</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- <div class="d-flex justify-content-end">
      <strong>ยอดรวม: {{ getTotalAmount() | number: '1.0-0' }} ฿</strong>
    </div> -->
    <div class="mt-3">
      <button class="btn btn-primary">ดำเนินการสั่งซื้อ</button>
    </div>
  </div>

  <ng-template #noItems>
    <p>ตะกร้าของคุณว่างเปล่า</p>
  </ng-template>
</div>
