<app-nav-header></app-nav-header>
<app-nav-appheader></app-nav-appheader>
<div class="container my-3">
    <div class="container my-3">
    <div class="d-flex align-items-center justify-content-end gap-2 bg-light p-3 rounded shadow-sm">
  <div class="sort fw-semibold">เรียงโดย</div>
  <div class="dropdown">
    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" 
            type="button" id="sortMenuButton"
            data-bs-toggle="dropdown" aria-expanded="false">
      <i class="bi bi-sort-down"></i> {{ sortLabel }}
    </button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="sortMenuButton">
      <li><a class="dropdown-item" (click)="setSortOrder('asc')">ราคา: จากน้อยไปมาก</a></li>
      <li><a class="dropdown-item" (click)="setSortOrder('desc')">ราคา: จากมากไปน้อย</a></li>
    </ul>
  </div>
</div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-3">
        <div class="col" *ngFor="let p of product">
            <a class="text-decoration-none text-dark h-100 d-block" [routerLink]="['/product-detail', p.productID]">
                <div class="card h-100">
                    <img *ngIf="p.image_Url1" [src]="p.image_Url1" class="card-img-top" [alt]="p.product_Name"
                        style="object-fit:cover; height:250px;" />
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title mb-1 text-truncate">{{ p.product_Name }}</h6>
                        <p class="mb-1 text-muted small text-truncate">{{ p.category_Name }}</p>

                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-bold">{{ p.price | number:'1.0-0' }} ฿</div>
                                <div *ngIf="p.price_Discount" class="text-decoration-line-through text-muted small">
                                    {{ p.price_Discount | number:'1.0-0' }} ฿
                                </div>
                            </div>
                            <!-- ถ้าต้องการไอคอน/ปุ่มเล็กๆ ให้ใส่ที่นี่ แต่เป็นลิงก์หลักแล้ว -->
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
